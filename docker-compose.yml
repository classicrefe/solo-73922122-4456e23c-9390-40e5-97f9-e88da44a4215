services:
  web:
    build: .
    image: catalog-inclusion:demo
    container_name: catalog-inclusion
    ports:
      - "8000:8000"
    volumes:
      - catalog-data:/data
    environment:
      CATALOG_DB: /data/catalog.db
      SECRET_KEY: demo-secret-change-me
    restart: unless-stopped

volumes:
  catalog-data:
